<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Heartbeat Metronome</title>
  <desc id="desc">Static poster for the experimental short film Heartbeat Metronome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111315"/>
      <stop offset=".55" stop-color="#5a4638"/>
      <stop offset="1" stop-color="#090a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".65" cy=".42" r=".48">
      <stop offset="0" stop-color="#e7c59a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#e7c59a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <path d="M110 440h250l46-110 70 230 56-152 48 32h420" fill="none" stroke="#f1dfc5" stroke-width="7" opacity=".82"/>
  <text x="80" y="110" fill="#f1dfc5" font-family="Georgia, serif" font-size="38" letter-spacing="7">EXPERIMENTAL SHORT</text>
  <text x="80" y="680" fill="#fff8ed" font-family="Georgia, serif" font-size="62">Heartbeat Metronome</text>
  <text x="84" y="728" fill="#e7c59a" font-family="Arial, sans-serif" font-size="20" letter-spacing="5">LIGHT / RHYTHM / BODY</text>
</svg>
